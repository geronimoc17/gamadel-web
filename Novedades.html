<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gamadel S.A. | Logística Global para el Agro</title>
    
    <link rel="icon" href="assets/img/LOGO_CIRCULAR.png" type="image/png">

    <link rel="preload" href="assets/video/DepositosNuevos.mp4" as="video" type="video/mp4">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <style>
        /* RESET Y BASE */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { 
            width: 100%; height: 100%; 
            overflow: hidden; 
            background-color: #000; 
            font-family: 'Roboto', sans-serif;
        }

        .expansion-section-full {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        /* VIDEO (PC) */
        .expansion-video-full {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            filter: brightness(0.5);
            background-color: #000;
        }

        /* IMAGEN (MÓVIL) */
        .mobile-fallback-img {
            display: none; /* Oculta por defecto */
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('assets/img/nuevosdepositos.JPEG') center center / cover no-repeat;
            z-index: 1;
            filter: brightness(0.5);
        }

        /* OVERLAY Y CONTENIDO */
        .expansion-overlay-full {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to right, rgba(0,0,0,0.8) 0%, transparent 100%);
            z-index: 2;
        }

        .expansion-content-full {
            position: absolute;
            top: 50%;
            left: 8%;
            transform: translateY(-50%);
            color: #fff;
            z-index: 10;
            width: 80%;
        }

        .badge {
            background: #DF4124;
            padding: 6px 15px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 800;
            letter-spacing: 2px;
            display: inline-block;
            margin-bottom: 15px;
            font-family: 'Montserrat', sans-serif;
        }

        .reveal-text {
            font-size: 6vw;
            font-weight: 900;
            line-height: 1.1;
            margin: 0;
            text-transform: uppercase;
            font-family: 'Montserrat', sans-serif;
        }

        .sub-reveal {
            font-size: 2vw;
            font-weight: 300;
            color: #DF4124;
            margin: 8px 0 20px 0;
            text-transform: uppercase;
        }

        .expansion-line {
            width: 70px;
            height: 4px;
            background: #DF4124;
            margin-bottom: 25px;
        }

        .expansion-content-full p {
            font-size: 1.1rem;
            max-width: 450px;
            margin-bottom: 30px;
            color: rgba(255,255,255,0.9);
        }

        /* BOTÓN WHATSAPP */
        .btn-preventa {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background-color: #25D366;
            color: white;
            padding: 15px 30px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 800;
            font-size: 1rem;
            transition: transform 0.3s ease;
            animation: pulse-soft 2s infinite ease-in-out;
        }

        @keyframes pulse-soft {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        /* MEDIA QUERIES PARA MÓVILES */
        @media (max-width: 768px) {
            .expansion-video-full { display: none !important; } /* APAGA EL VIDEO */
            .mobile-fallback-img { display: block; } /* ENCIENDE LA IMAGEN */

            .expansion-content-full {
                left: 0; width: 100%;
                padding: 0 30px;
                text-align: center;
                display: flex;
                flex-direction: column;
                align-items: center;
            }

            .reveal-text { font-size: 10vw; }
            .sub-reveal { font-size: 1.2rem; }
            .expansion-line { margin: 0 auto 15px; }
        }
    </style>
</head>
<body>

    <section class="expansion-section-full">
        <video autoplay muted loop playsinline preload="auto" 
               poster="assets/video/NuevosDepositos1erframe.png" 
               class="expansion-video-full" id="videoExpansion">
            <source src="assets/video/DepositosNuevos.mp4" type="video/mp4">
        </video>

        <div class="mobile-fallback-img"></div>
        
        <div class="expansion-overlay-full"></div>

        <div class="expansion-content-full">
            <span class="badge">PROYECTO 2026</span>
            <h1 class="reveal-text">PRÓXIMAMENTE</h1>
            <h2 class="sub-reveal">NUEVOS DEPÓSITOS</h2>
            <div class="expansion-line"></div>
            <p>Estamos construyendo el futuro de la logística agroindustrial. Capacidad estratégica y tecnología de punta.</p>
            
            <a href="https://wa.me/2475410435" class="btn-preventa" target="_blank">
                <i class="fab fa-whatsapp"></i> CONTÁCTANOS
            </a>
        </div>
    </section>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const v = document.getElementById('videoExpansion');
            // Solo ajustar velocidad si el video existe y no estamos en móvil
            if(v && window.innerWidth > 768) {
                v.playbackRate = 0.6;
            }
        });
    </script>
    
</body>
</html>
